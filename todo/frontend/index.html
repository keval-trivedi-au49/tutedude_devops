<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO</title>
  </head>
  <body>
    <h1>Todo Form</h1>
    <form action="/submittodoitem" method="post">
        <div>
        <label>Item Id</label>
        <input type="text" name="itemId" placeholder="Enter a todo item Id" />
      </div>
      <br />
      <div>
        <label>Item Name</label>
        <input type="text" name="name" placeholder="Enter a todo item" />
      </div>
      <br />
      <div>
        <label>Item Description</label>
        <input
          type="text"
          name="description"
          placeholder="Enter a todo description"
        />
      </div>
      <br />
      {%if error%}
      <p style="color: red">{{error}}</p>
      {%endif%}
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
